<script>
  (function () {
    var h = document.documentElement;
    try {
      var t = localStorage.getItem('wj-theme');
      if (t !== 'paper' && t !== 'night') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper';
      }
      h.setAttribute('data-theme', t);
      var s = localStorage.getItem('wj-size');
      h.setAttribute('data-size', (s === 's' || s === 'm' || s === 'l') ? s : 'm');
    } catch (e) {
      h.setAttribute('data-theme', 'paper');
      h.setAttribute('data-size', 'm');
    }
  })();
</script>
